<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login | Shirwal Circle</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header container"><nav class="navbar glass-card"><div class="brand">Shirwal Circle</div><div class="nav-links"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="account.html">Account</a><span class="chip">Cart: <span data-cart-count>0</span></span></div></nav></header>
<main class="container section">
  <section class="glass-card card-pad">
    <h1 class="section-title">Welcome Back</h1>
    <p class="muted">Login to continue shopping across local Shirwal vendors.</p>
    <div data-login-state></div>
    <form data-login-form>
      <label>Username</label><input class="glass-input" type="text" name="username" required>
      <label>Password</label><input class="glass-input" type="password" name="password" required>
      <p class="muted"><strong>Sample Login:</strong> demo@shirwalcircle.in / Shirwal@123</p>
      <p class="muted" data-login-help></p>
      <button class="glass-btn" type="submit">Login</button>
    </form>
  </section>
</main>
<script src="js/app.js"></script>
</body></html>
