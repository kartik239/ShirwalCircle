<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login | Shirwal Circle</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header container"><nav class="navbar glass-card"><div class="brand">Shirwal Circle</div><div class="nav-links"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="account.html">Account</a></div></nav></header>
<main class="container section">
  <section class="glass-card card-pad">
    <h1 class="section-title">Login</h1>
    <form data-login-form>
      <label>Email</label><input class="glass-input" type="email" name="email" required>
      <label>Password</label><input class="glass-input" type="password" name="password" required>
      <br><br><button class="glass-btn" type="submit">Login</button>
      <a class="glass-btn" href="credentials.html">View Stored Credentials</a>
    </form>
  </section>
</main>
<script src="js/app.js"></script>
</body></html>
