<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Shirwal Circle</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header container"><nav class="navbar glass-card"><a class="brand" href="index.html">Shirwal Circle</a><div class="nav-links"><a class="nav-link" href="cart.html">Cart</a><a class="nav-link" href="checkout.html">Checkout</a><a class="nav-link" data-auth="logged-in" href="account.html">Account</a><span class="chip">Cart: <span data-cart-count>0</span></span><a class="nav-link" data-auth="logged-in" data-logout href="#">Logout</a></div></nav></header>
<main class="container section"><h1 class="section-title">Checkout</h1><div class="grid info-grid"><section class="glass-card card-pad"><form data-checkout-form><h3>Delivery Address</h3><input class="glass-input" name="address" placeholder="House / Flat, Area, Shirwal" required><br><br><h3>Shop WhatsApp Number</h3><input class="glass-input" name="whatsapp" placeholder="e.g. 919876543210" required><p class="muted">You can update this later with your final business WhatsApp number.</p><h3>Payment Method</h3><p><span class="chip">COD</span> <span class="chip">UPI</span> <span class="chip">Card</span></p><button class="glass-btn" type="submit">Send Order to WhatsApp</button></form></section><aside class="glass-card card-pad"><h3>Order Summary</h3><p>Items and amount are sent automatically from your real cart.</p></aside></div></main>
<script src="js/app.js"></script>
</body></html>
